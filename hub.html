<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Horse Care – Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Crimson+Pro:wght@300;400;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  width:100vw; height:100svh; overflow:hidden;
  background:#1a2820;
  font-family:'Crimson Pro', serif;
}

.screen {
  position:relative; width:100%; height:100%;
  max-width:430px; margin:0 auto; overflow:hidden;
  display:flex; flex-direction:column;
}

/* ── OBERE HÄLFTE – Stallhintergrund ── */
.horse-zone {
  position:relative; flex:1; min-height:0; overflow:hidden;
  min-height: 200px;
}

/* Die vier Hintergrund-Ebenen, alle übereinander */
.bg-layer {
  position:absolute; inset:0;
  background-size:cover;
  background-position:center bottom;
  transition:opacity 1.2s ease;
  opacity:0;
}
.bg-layer.active { opacity:1; }

#bg-morgens { background-image:url("stall_morgens.png"); }
#bg-mittags { background-image:url("stall_mittags.png"); }
#bg-abends  { background-image:url("stall_abends.png"); }
#bg-nachts  { background-image:url("stall_nachts.png"); }

.game-title {
  position:absolute; top:5%; width:100%; text-align:center;
  font-family:'Great Vibes', cursive;
  font-size:clamp(38px,10vw,52px);
  color:#fff;
  text-shadow: 0 2px 10px rgba(0,0,0,0.45);
  z-index:10;
}

/* Tageszeit-Badge oben links */
.daytime-badge {
  position:absolute; top:10%; left:5%;
  background:rgba(0,0,0,0.35);
  border:1px solid rgba(255,255,255,0.3);
  border-radius:50px; padding:4px 12px;
  backdrop-filter:blur(6px);
  font-size:12px; color:#fff; font-weight:600;
  display:flex; align-items:center; gap:5px;
  z-index:10;
  transition:opacity .6s;
}
#daytimeEmoji { font-size:15px; }

/* Level-Badge oben rechts */
.level-badge {
  position:absolute; top:10%; right:5%;
  background:rgba(0,0,0,0.35);
  border:1px solid rgba(255,255,255,0.3);
  border-radius:50px; padding:4px 14px;
  backdrop-filter:blur(6px);
  font-size:13px; color:#fff; font-weight:600;
  display:flex; align-items:center; gap:4px;
  z-index:10;
}
.level-badge .lvl-num { font-size:17px; }

.foal-wrap {
  position:absolute; bottom:0; left:50%; transform:translateX(-50%);
  width:clamp(120px, 45%, 190px);
  max-height:48%;
  z-index:10;
  display:flex; align-items:flex-end; justify-content:center;
}
.foal-wrap img {
  width:auto;
  height:auto;
  max-width:100%;
  max-height:clamp(150px, 42svh, 220px);
  object-fit:contain;
  display:block;
  filter:drop-shadow(0 8px 20px rgba(0,0,0,0.4));
}

/* ── UNTERE HÄLFTE ── */
.bottom-zone {
  background:rgba(20,35,28,0.82);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-top:1px solid rgba(255,255,255,0.15);
  padding:9px 14px 12px;
  flex-shrink:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  max-height:55vh;
}

.time-bar {
  display:flex; align-items:center; justify-content:space-between;
  background:rgba(255,255,255,0.1); border-radius:12px; padding:5px 12px;
  margin-bottom:8px;
}
.time-label { font-size:11px; color:rgba(255,255,255,0.6); }
.time-display {
  font-family:'Crimson Pro'; font-size:18px; font-weight:600; color:#fff;
}
.day-label { font-size:11px; color:rgba(255,255,255,0.6); }

.status-section { margin-bottom:7px; }

.status-row {
  display:flex; align-items:center; gap:7px; margin-bottom:5px;
}
.status-icon-sm {
  width:24px; height:24px; object-fit:contain; flex-shrink:0;
}
.status-label {
  font-size:11px; color:rgba(255,255,255,0.85); font-weight:600; width:68px; flex-shrink:0;
}
.bar-bg {
  flex:1; height:7px; background:rgba(255,255,255,0.1);
  border-radius:10px; overflow:hidden;
}
.bar-fill {
  height:100%; border-radius:10px; transition:width .4s;
}
.bar-fill.happiness { background:linear-gradient(90deg,#f9c74f,#f4a261); }
.bar-fill.hygiene   { background:linear-gradient(90deg,#4ecdc4,#1a9e75); }
.bar-fill.hunger    { background:linear-gradient(90deg,#a8d8ea,#5ea7c5); }
.bar-fill.thirst    { background:linear-gradient(90deg,#74b9ff,#0984e3); }
.bar-fill.energy    { background:linear-gradient(90deg,#fd79a8,#e84393); }
.bar-pct {
  font-size:11px; color:rgba(255,255,255,0.75); font-weight:600; width:28px; text-align:right;
}

.xp-row {
  display:flex; align-items:center; gap:8px; margin-bottom:8px;
}
.xp-label { font-size:11px; color:rgba(255,255,255,0.75); font-weight:600; }
.xp-bg { flex:1; height:6px; background:rgba(255,255,255,0.1); border-radius:10px; overflow:hidden; }
.xp-fill {
  height:100%; border-radius:10px;
  background:linear-gradient(90deg,#a29bfe,#6c5ce7);
  transition:width .4s;
}
.xp-pct { font-size:11px; color:rgba(255,255,255,0.75); font-weight:600; width:28px; text-align:right; }

.menu-grid {
  display:grid; grid-template-columns:repeat(4,1fr); gap:7px;
}
.menu-btn {
  background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:14px; padding:7px 4px 5px;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  cursor:pointer;
  transition:transform .15s, background .15s;
  -webkit-tap-highlight-color:transparent;
}
.menu-btn:active { transform:scale(.95); background:rgba(255,255,255,0.22); }
.menu-btn img { width:40px; height:40px; object-fit:contain; }
.menu-btn span {
  font-size:10px; font-weight:600; color:rgba(255,255,255,0.9); text-align:center;
}

/* ── WETTER-OVERLAY ── */
.weather-overlay {
  position:absolute; inset:0; z-index:2;
  pointer-events:none;
  transition:background 1.5s ease;
}

/* Wetter-Badge neben Daytime-Badge */
.weather-badge {
  position:absolute; top:10%; left:5%;
  background:rgba(0,0,0,0.35);
  border:1px solid rgba(255,255,255,0.3);
  border-radius:50px; padding:4px 12px;
  backdrop-filter:blur(6px);
  font-size:12px; color:#fff; font-weight:600;
  display:flex; align-items:center; gap:5px;
  z-index:10;
}

/* Wettereffekt-Info-Leiste */
.weather-info-bar {
  position:relative; z-index:10;
  margin:0 14px 8px;
  border-radius:12px; padding:7px 12px;
  font-size:11px; color:#fff;
  display:flex; align-items:center; gap:8px;
  backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,0.12);
  transition:background .8s ease;
  flex-shrink:0;
}
.weather-info-icon { font-size:18px; flex-shrink:0; }
.weather-info-text { flex:1; line-height:1.3; opacity:.85; }
.weather-blocked {
  font-size:10px; color:#ff6b6b; font-weight:600;
  background:rgba(220,53,69,0.2); border-radius:50px;
  padding:2px 8px; flex-shrink:0;
}

/* ── REGEN-PARTIKEL ── */
.particle-container {
  position:absolute; inset:0; z-index:3;
  pointer-events:none; overflow:hidden;
}
.raindrop {
  position:absolute; top:-20px;
  width:2px; border-radius:2px;
  background:rgba(150,200,255,0.6);
  animation:rainFall linear infinite;
}
@keyframes rainFall {
  to { transform:translateY(120vh) translateX(-20px); }
}

/* ── SCHNEE-PARTIKEL ── */
.snowflake {
  position:absolute; top:-20px;
  color:rgba(220,240,255,0.85);
  font-size:12px;
  animation:snowFall linear infinite;
}
@keyframes snowFall {
  to { transform:translateY(110vh) translateX(30px) rotate(360deg); }
}

/* ── NEBEL ── */
.fog-layer {
  position:absolute; inset:0; z-index:3;
  background:linear-gradient(
    to bottom,
    rgba(180,180,180,0) 0%,
    rgba(180,180,180,0.25) 40%,
    rgba(180,180,180,0.15) 100%
  );
  pointer-events:none;
  animation:fogDrift 8s ease-in-out infinite alternate;
}
@keyframes fogDrift {
  from { opacity:0.6; transform:translateX(-10px); }
  to   { opacity:1;   transform:translateX(10px); }
}

/* ── BLITZ ── */
.lightning-flash {
  position:absolute; inset:0; z-index:4;
  background:rgba(255,255,255,0.85);
  pointer-events:none;
  opacity:0;
  animation:lightningFlash 6s ease infinite;
}
@keyframes lightningFlash {
  0%,90%,100% { opacity:0; }
  91%,93%     { opacity:0.8; }
  92%,94%     { opacity:0; }
}

/* ══════════════════════════════════════════

/* Nutze dvh (dynamic viewport height) wo verfügbar,

:root {

  --screen-h: 100vh;
}

/* Safe-area für Home-Indicator (neuere iPhones) */
.screen, body {
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

/* SE-spezifische Verkleinerungen */

  /* Kleinere Schrift & Abstände generell */
  body { font-size: 13px; }

  /* Header kompakter */
  .header { padding: 10px 14px 6px !important; }

  /* Panels kompakter */
  .action-panel, .bottom-zone, .info-panel {
    padding: 8px 12px 10px !important;
  }

  /* Abstände reduzieren */
  .section-title { margin: 8px 0 5px !important; }

  .menu-grid { gap: 5px !important; }
  .status-section { margin-bottom: 5px !important; }
  .status-row { margin-bottom: 3px !important; }
  .xp-row { margin-bottom: 5px !important; }
  .treatment-list { gap: 5px !important; }

  /* Kleinere Icons in Grids */
  .menu-btn img { width: 34px !important; height: 34px !important; }

  .menu-btn span { font-size: 9px !important; }

  /* Kleinere Task-Rows */
  .task-row { padding: 7px 10px !important; }
  .task-icon { width: 32px !important; height: 32px !important; }
  .task-name { font-size: 13px !important; }
  .task-desc { font-size: 10px !important; }

  /* Status-Icons kleiner */
  .status-icon-sm { width: 20px !important; height: 20px !important; }
  .status-label { font-size: 10px !important; width: 60px !important; }
  .bar-bg { height: 6px !important; }
  .bar-pct { font-size: 10px !important; }

  /* Zeitanzeige kompakter */
  .time-bar { padding: 4px 10px !important; margin-bottom: 5px !important; }
  .time-display { font-size: 15px !important; }

  /* Münz-Badge */
  .coins-badge { padding: 4px 10px !important; }
  .coins-amount { font-size: 14px !important; }

  /* Wetter-Info-Bar */
  .weather-info-bar { padding: 5px 10px !important; margin-bottom: 5px !important; font-size: 10px !important; }
  .weather-info-icon { font-size: 14px !important; }

  /* Feed-Buttons im Stall */
  .menu-btn-feed { padding: 6px 4px 4px !important; }
  .menu-btn-feed img { width: 30px !important; height: 30px !important; }

  /* Shop-Grid enger */
  .items-grid { gap: 7px !important; }
  .item-img { width: 44px !important; height: 44px !important; }
  .item-name { font-size: 12px !important; }
  .item-desc { font-size: 9px !important; }
  .item-price { font-size: 11px !important; padding: 3px 9px !important; }

  /* Behandlungs-Buttons im Tierarzt */
  .treatment-btn { padding: 9px 12px !important; }
  .treat-icon { width: 34px !important; height: 34px !important; }

  .treat-desc { font-size: 10px !important; }

  /* Stat-Karten */
  .stat-card { padding: 6px 8px !important; }
  .stat-card img { width: 20px !important; height: 20px !important; }
  .stat-card-val { font-size: 14px !important; }

  /* Tierarzt-Hero kleiner */
  .vet-hero { height: 140px !important; }
  #vetImg { height: 150px !important; }
}

/* Noch kleinere Geräte (z.B. iPhone SE 1. Gen, 568px Höhe) */
@media screen and (max-height: 580px) {
  .vet-hero { height: 110px !important; }
  #vetImg { height: 120px !important; }
  .header-title { font-size: 26px !important; }
  .game-title { font-size: clamp(28px, 8vw, 38px) !important; }
  .foal-wrap { width: clamp(100px, 40%, 160px) !important; }
  .foal-wrap img { max-height: clamp(120px, 36svh, 170px) !important; }
}

<script>

// ── Tageszeit ─────────────────────────────────────────────
const PERIODS = [
  { id:'morgens', label:'Morgen', emoji:'🌅', from:6,  to:11 },
  { id:'mittags', label:'Mittag', emoji:'☀️',  from:11, to:17 },
  { id:'abends',  label:'Abend',  emoji:'🌇', from:17, to:21 },
  { id:'nachts',  label:'Nacht',  emoji:'🌙', from:21, to:6  },
];

function getPeriod(h) {
  for (const p of PERIODS) {
    if (p.from < p.to) {
      if (h >= p.from && h < p.to) return p;
    } else {
      if (h >= p.from || h < p.to) return p;
    }
  }
  return PERIODS[0];
}

let currentPeriodId = null;

function updateClock(force) {
  const now = new Date();
  const h   = now.getHours();
  const m   = now.getMinutes();
  const el  = document.getElementById('clockDisplay');
  if (el) el.textContent = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');

  const period = getPeriod(h);
  if (force || period.id !== currentPeriodId) {
    currentPeriodId = period.id;
    document.querySelectorAll('.bg-layer').forEach(el => el.classList.remove('active'));
    const bgEl = document.getElementById('bg-' + period.id);
    if (bgEl) bgEl.classList.add('active');
    const emoji = document.getElementById('daytimeEmoji');
    const label = document.getElementById('daytimeLabel');
    if (emoji) emoji.textContent = period.emoji;
    if (label) label.textContent = period.label;
  }
}

// ── Spielstand ────────────────────────────────────────────
let gd = GameData.load();

// Kein Spielstand → zurück zum Start
if (!gd.race) window.location.href = 'titlescreen.html';

// ── Münzen aufrechnen ─────────────────────────────────────
function accrueCoins() {
  const RATE = 10 / (60 * 60 * 1000);
  if (!gd.lastCoinAccrual) { gd.lastCoinAccrual = new Date().toISOString(); return; }
  const elapsed = Date.now() - new Date(gd.lastCoinAccrual).getTime();
  const earned  = Math.floor(elapsed * RATE);
  if (earned > 0) {
    gd.coins = (gd.coins || 0) + earned;
    gd.lastCoinAccrual = new Date().toISOString();
  }
}

// ── Alle UI-Elemente rendern ──────────────────────────────
function renderAll() {
  const s = gd.stats;

  // Statusleisten
  setBar('Happiness', s.happiness);
  setBar('Hygiene',   s.hygiene);
  setBar('Hunger',    s.hunger);
  setBar('Thirst',    s.thirst);
  setBar('Energy',    s.energy);

  // XP & Level
  document.getElementById('lvlNum').textContent = gd.level;
  const xpPct = Math.round((gd.xp / gd.xpToNextLevel) * 100);
  document.getElementById('xpFill').style.width = xpPct + '%';
  document.getElementById('xpPct').textContent  = xpPct + '%';

  // Spieltag
  document.getElementById('dayLabel').textContent = 'Tag ' + (gd.gameDay || 1);

  // Münzen
  const hubCoins = document.getElementById('hubCoins');
  if (hubCoins) hubCoins.textContent = Math.floor(gd.coins || 0);

  // Pferdename als Titel
  const titleEl = document.getElementById('gameTitle');
  if (titleEl) titleEl.textContent = gd.horseName || 'Horse Care';

  // Rassename Untertitel
  let sub = document.getElementById('raceSub');
  if (gd.race) {
    if (!sub) {
      sub = document.createElement('div');
      sub.id = 'raceSub';
      sub.style.cssText = 'font-family:Crimson Pro,serif;font-size:13px;color:rgba(255,255,255,0.65);letter-spacing:2px;text-transform:uppercase;margin-top:-4px;text-shadow:0 1px 4px rgba(0,0,0,0.4);position:relative;z-index:10;text-align:center;';
      if (titleEl) titleEl.insertAdjacentElement('afterend', sub);
    }
    sub.textContent = gd.race.name;
  }

  // XP-Akzentfarbe
  if (gd.race && gd.race.accent) {
    document.getElementById('xpFill').style.background =
      'linear-gradient(90deg,' + gd.race.accent + '99,' + gd.race.accent + ')';
  }

  // Pferdbild
  if (gd.race && gd.race.img) {
    const img = document.querySelector('.foal-wrap img');
    if (img && img.src.indexOf(gd.race.img) === -1) {
      const t = new Image();
      t.onload = () => { img.src = gd.race.img; };
      t.src = gd.race.img;
    }
  }
}

function setBar(key, val) {
  const bar = document.getElementById('bar' + key);
  const pct = document.getElementById('pct' + key);
  if (bar) bar.style.width  = Math.round(val) + '%';
  if (pct) pct.textContent  = Math.round(val) + '%';
}

// ── Stat-Verfall ──────────────────────────────────────────
function runDecay() {
  gd = GameData.applyDecay(gd);
  gd = WeatherSystem.applyWeatherDecay(gd);
  renderAll();
}

// ── Wetter rendern ────────────────────────────────────────
function renderWeather() {
  const w = WeatherSystem.get(gd);
  document.getElementById('weatherEmoji').textContent     = w.emoji;
  document.getElementById('weatherLabel').textContent     = w.label;
  document.getElementById('weatherInfoEmoji').textContent = w.emoji;
  document.getElementById('weatherInfoText').textContent  = w.desc;

  const barColors = {
    sunny:'rgba(255,180,0,0.18)', cloudy:'rgba(120,120,160,0.18)',
    rain:'rgba(60,100,180,0.25)', storm:'rgba(30,30,80,0.35)',
    snow:'rgba(180,220,255,0.20)', fog:'rgba(150,150,150,0.22)',
  };
  const infoBar = document.getElementById('weatherInfoBar');
  if (infoBar) infoBar.style.background = barColors[w.id] || 'rgba(0,0,0,0.2)';

  document.getElementById('weatherOverlay').style.background = w.bgOverlay || '';
  buildParticles(w.id);

  const old = document.querySelector('.weather-blocked');
  if (old) old.remove();
  if (w.blockedActions && w.blockedActions.length > 0) {
    const span = document.createElement('span');
    span.className = 'weather-blocked';
    span.textContent = '⚠️ ' + w.blockedActions.map(a =>
      a === 'ausritt' ? 'Kein Ausritt' :
      a === 'training' ? 'Kein Training' : a
    ).join(', ');
    if (infoBar) infoBar.appendChild(span);
  }
}

function buildParticles(weatherId) {
  const container = document.getElementById('particleContainer');
  if (!container) return;
  container.innerHTML = '';

  if (weatherId === 'rain' || weatherId === 'storm') {
    const count = weatherId === 'storm' ? 60 : 35;
    for (let i = 0; i < count; i++) {
      const drop = document.createElement('div');
      drop.className = 'raindrop';
      drop.style.cssText = `left:${Math.random()*105}%;height:${8+Math.random()*18}px;opacity:${0.4+Math.random()*0.5};animation-duration:${0.5+Math.random()*0.6}s;animation-delay:${-Math.random()*2}s;`;
      container.appendChild(drop);
    }
    if (weatherId === 'storm') {
      const flash = document.createElement('div');
      flash.className = 'lightning-flash';
      container.appendChild(flash);
    }
  }
  if (weatherId === 'snow') {
    const flakes = ['❄','❅','❆','✦','✧'];
    for (let i = 0; i < 25; i++) {
      const f = document.createElement('div');
      f.className = 'snowflake';
      f.textContent = flakes[Math.floor(Math.random()*flakes.length)];
      f.style.cssText = `left:${Math.random()*100}%;font-size:${8+Math.random()*14}px;opacity:${0.5+Math.random()*0.5};animation-duration:${3+Math.random()*4}s;animation-delay:${-Math.random()*5}s;`;
      container.appendChild(f);
    }
  }
  if (weatherId === 'fog') {
    const fog = document.createElement('div');
    fog.className = 'fog-layer';
    container.appendChild(fog);
  }
}

// ── Spielstand neu laden wenn Seite wieder sichtbar ───────
// (z.B. nach Rückkehr vom Stall, Shop etc.)
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    gd = GameData.load();
    accrueCoins();
    gd = WeatherSystem.load(gd);
    renderAll();
    renderWeather();
    updateClock(true);
  }
});

// pageshow fängt auch den Back-Button ab (iOS Safari Cache)
window.addEventListener('pageshow', (e) => {
  gd = GameData.load();
  accrueCoins();
  gd = WeatherSystem.load(gd);
  renderAll();
  renderWeather();
  updateClock(true);
});

// ── Auto-Speichern beim Verlassen ─────────────────────────
GameData.registerAutosave(() => gd);

// ── Init ──────────────────────────────────────────────────
gd = WeatherSystem.load(gd);
accrueCoins();
renderAll();
renderWeather();
updateClock(true);
setInterval(() => updateClock(false), 15000);
setInterval(runDecay,    60000);

function confirmNewGame() {
  if (confirm('Möchtest du wirklich ein neues Pferd starten? Dein aktueller Fortschritt geht verloren.')) {
    GameData.reset();
    window.location.href = 'titlescreen.html';
  }
}

function showMenu(name) {
  alert('Bereich: ' + name + ' (noch nicht implementiert)');
}
</script>
