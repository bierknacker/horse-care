<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Horse Care – Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  width:100vw; height:100svh; overflow:hidden;
  background:#f0f7f4; font-family:'Crimson Pro', serif;
}
.screen {
  position:relative; width:100%; height:100%;
  max-width:430px; margin:0 auto;
  display:flex; flex-direction:column; overflow:hidden;
}

/* Hintergrund */
.bg {
  position:absolute; inset:0; z-index:0;
  background:
    radial-gradient(ellipse 120% 50% at 50% 0%, #d4ede6 0%, transparent 65%),
    linear-gradient(180deg, #f0f7f4 0%, #e8f5f0 100%);
}

/* ── HEADER ── */
.header {
  position:relative; z-index:10;
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 16px 10px;
  background:linear-gradient(to bottom, rgba(255,255,255,0.9) 0%, transparent 100%);
  flex-shrink:0;
}
.btn-back {
  background:rgba(255,255,255,0.9); border:1px solid rgba(150,200,170,0.5);
  border-radius:50px; padding:7px 16px;
  color:#2d5a4a; font-family:'Crimson Pro'; font-size:14px; font-weight:600;
  cursor:pointer; backdrop-filter:blur(6px);
  -webkit-tap-highlight-color:transparent; transition:background .15s;
}
.btn-back:active { background:rgba(220,240,235,0.95); }
.header-title {
  font-family:'Great Vibes'; font-size:34px; color:#2d5a4a;
  text-shadow:0 2px 10px rgba(0,0,0,0.5);
}

/* Münz-Badge */
.coins-badge {
  display:flex; align-items:center; gap:5px;
  background:rgba(255,240,200,0.9);
  border:1px solid rgba(200,140,10,0.4);
  border-radius:50px; padding:6px 14px;
  backdrop-filter:blur(6px);
}
.coins-icon { font-size:16px; }
.coins-amount {
  font-size:16px; font-weight:600; color:#c8860a;
  min-width:32px; text-align:right;
  transition:transform .2s;
}

/* ── KATEGORIEN-TABS ── */
.tabs {
  position:relative; z-index:10;
  display:flex; gap:6px; padding:0 16px 10px;
  overflow-x:auto; flex-shrink:0;
}
.tabs::-webkit-scrollbar { display:none; }
.tab {
  flex-shrink:0;
  background:rgba(255,255,255,0.8);
  border:1px solid rgba(150,200,170,0.4);
  border-radius:50px; padding:6px 16px;
  font-size:12px; font-weight:600; color:rgba(45,90,74,0.6);
  cursor:pointer; transition:all .2s;
  -webkit-tap-highlight-color:transparent;
}
.tab.active {
  background:rgba(45,90,74,0.12);
  border-color:rgba(45,90,74,0.4);
  color:#2d5a4a;
}

/* ── ARTIKEL-GRID ── */
.shop-scroll {
  position:relative; z-index:10;
  flex:1; overflow-y:auto; padding:4px 16px 20px;
  -webkit-overflow-scrolling:touch;
}
.shop-scroll::-webkit-scrollbar { display:none; }

.items-grid {
  display:grid; grid-template-columns:1fr 1fr; gap:10px;
}

.item-card {
  background:rgba(255,255,255,0.9);
  border:1px solid rgba(180,220,200,0.5);
  box-shadow:0 2px 10px rgba(100,160,140,0.1);
  border-radius:16px; padding:12px 10px 10px;
  display:flex; flex-direction:column; align-items:center; gap:6px;
  cursor:pointer; transition:background .15s, transform .1s, border-color .15s;
  -webkit-tap-highlight-color:transparent;
  position:relative;
}
.item-card:active { transform:scale(.96); background:rgba(220,240,235,0.95); }
.item-card.cant-afford {
  opacity:0.45;
  cursor:not-allowed;
}
.item-card.cant-afford:active { transform:none; }

.item-img {
  width:56px; height:56px; object-fit:contain;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,0.4));
}
.item-name {
  font-size:13px; font-weight:600; color:#2d5a4a; text-align:center; line-height:1.2;
}
.item-desc {
  font-size:10px; color:rgba(45,90,74,0.5); text-align:center; line-height:1.3;
}

/* Effekte-Chips */
.item-effects {
  display:flex; flex-wrap:wrap; gap:3px; justify-content:center;
}
.effect-chip {
  font-size:9px; font-weight:600; padding:2px 6px; border-radius:50px;
  background:rgba(255,255,255,0.08); color:rgba(255,255,255,0.6);
}
.effect-chip.hunger    { background:rgba(90,167,197,0.2);  color:#74b9ff; }
.effect-chip.thirst    { background:rgba(9,132,227,0.2);   color:#74b9ff; }
.effect-chip.energy    { background:rgba(232,67,147,0.2);  color:#fd79a8; }
.effect-chip.hygiene   { background:rgba(78,205,196,0.2);  color:#4ecdc4; }
.effect-chip.happiness { background:rgba(249,199,79,0.2);  color:#f9c74f; }

/* Preis-Button */
.item-price {
  display:flex; align-items:center; gap:4px;
  background:rgba(255,240,200,0.9);
  border:1px solid rgba(200,140,10,0.35);
  border-radius:50px; padding:4px 12px;
  font-size:13px; font-weight:600; color:#c8860a;
  margin-top:2px;
}
.item-card.cant-afford .item-price {
  background:rgba(100,100,100,0.15);
  border-color:rgba(100,100,100,0.3);
  color:rgba(255,255,255,0.3);
}

/* Kauf-Flash */
.buy-flash {
  position:absolute; inset:0; border-radius:16px;
  background:rgba(212,160,23,0.25);
  pointer-events:none; opacity:0;
  animation:flashAnim .4s ease forwards;
}
@keyframes flashAnim {
  0%   { opacity:0.8; }
  100% { opacity:0; }
}

/* Münz-Auflade-Info */
.coin-info {
  position:relative; z-index:10;
  margin:0 16px 10px;
  background:rgba(255,248,220,0.9);
  border:1px solid rgba(200,160,50,0.3);
  border-radius:12px; padding:8px 14px;
  display:flex; align-items:center; gap:8px;
  flex-shrink:0;
}
.coin-info-text {
  font-size:11px; color:rgba(80,60,20,0.7); line-height:1.4;
}
.coin-info-text b { color:#c8860a; }

.owned-badge {
  font-size:10px; font-weight:600; color:#c8860a;
  background:rgba(255,240,200,0.9); border:1px solid rgba(200,140,10,0.3);
  border-radius:50px; padding:2px 8px;
}

/* Toast */
.toast {
  position:fixed; top:16%; left:50%; transform:translateX(-50%);
  background:rgba(212,160,23,0.92); color:#1a1000;
  font-family:'Crimson Pro'; font-size:15px; font-weight:700;
  padding:8px 20px; border-radius:50px;
  pointer-events:none; z-index:999; white-space:nowrap;
  animation:toastAnim .95s ease forwards;
}
.toast.err {
  background:rgba(220,53,69,0.92); color:#fff;
}
@keyframes toastAnim {
  0%   { opacity:0; transform:translateX(-50%) translateY(10px); }
  15%  { opacity:1; transform:translateX(-50%) translateY(0); }
  80%  { opacity:1; }
  100% { opacity:0; transform:translateX(-50%) translateY(-8px); }
}

/* ══════════════════════════════════════════
   RESPONSIVE – iPhone SE (375×667) Support
   ══════════════════════════════════════════ */

/* Nutze dvh (dynamic viewport height) wo verfügbar,
   fallback auf 100vh für ältere Safari */
:root {
  --vh: 1vh;
  --screen-h: 100vh;
}

/* Safe-area für Home-Indicator (neuere iPhones) */
.screen, body {
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

/* SE-spezifische Verkleinerungen */
@media screen and (max-height: 680px) {
  /* Coin-Info auf kleinen Screens ausblenden */
  .coin-info { display: none !important; }

  /* Kleinere Schrift & Abstände generell */
  body { font-size: 13px; }

  /* Header kompakter */
  .header { padding: 10px 14px 6px !important; }

  /* Panels kompakter */
  .action-panel, .bottom-zone, .info-panel {
    padding: 8px 12px 10px !important;
  }

  /* Abstände reduzieren */
  .section-title { margin: 8px 0 5px !important; }
  .tasks { gap: 5px !important; }
  .menu-grid { gap: 5px !important; }
  .status-section { margin-bottom: 5px !important; }
  .status-row { margin-bottom: 3px !important; }
  .xp-row { margin-bottom: 5px !important; }
  .treatment-list { gap: 5px !important; }

  /* Kleinere Icons in Grids */
  .menu-btn img { width: 34px !important; height: 34px !important; }
  .menu-btn { padding: 5px 4px 4px !important; border-radius: 12px !important; }
  .menu-btn span { font-size: 9px !important; }

  /* Kleinere Task-Rows */
  .task-row { padding: 7px 10px !important; }
  .task-icon { width: 32px !important; height: 32px !important; }
  .task-name { font-size: 13px !important; }
  .task-desc { font-size: 10px !important; }

  /* Status-Icons kleiner */
  .status-icon-sm { width: 20px !important; height: 20px !important; }
  .status-label { font-size: 10px !important; width: 60px !important; }
  .bar-bg { height: 6px !important; }
  .bar-pct { font-size: 10px !important; }

  /* Zeitanzeige kompakter */
  .time-bar { padding: 4px 10px !important; margin-bottom: 5px !important; }
  .time-display { font-size: 15px !important; }

  /* Münz-Badge */
  .coins-badge { padding: 4px 10px !important; }
  .coins-amount { font-size: 14px !important; }

  /* Wetter-Info-Bar */
  .weather-info-bar { padding: 5px 10px !important; margin-bottom: 5px !important; font-size: 10px !important; }
  .weather-info-icon { font-size: 14px !important; }

  /* Feed-Buttons im Stall */
  .menu-btn-feed { padding: 6px 4px 4px !important; }
  .menu-btn-feed img { width: 30px !important; height: 30px !important; }

  /* Shop-Grid enger */
  .items-grid { gap: 7px !important; }
  .item-img { width: 44px !important; height: 44px !important; }
  .item-name { font-size: 12px !important; }
  .item-desc { font-size: 9px !important; }
  .item-price { font-size: 11px !important; padding: 3px 9px !important; }

  /* Behandlungs-Buttons im Tierarzt */
  .treatment-btn { padding: 9px 12px !important; }
  .treat-icon { width: 34px !important; height: 34px !important; }
  .treat-name { font-size: 13px !important; }
  .treat-desc { font-size: 10px !important; }

  /* Stat-Karten */
  .stat-card { padding: 6px 8px !important; }
  .stat-card img { width: 20px !important; height: 20px !important; }
  .stat-card-val { font-size: 14px !important; }

  /* Tierarzt-Hero kleiner */
  .vet-hero { height: 140px !important; }
  #vetImg { height: 150px !important; }
}

/* Noch kleinere Geräte (z.B. iPhone SE 1. Gen, 568px Höhe) */
@media screen and (max-height: 580px) {
  .vet-hero { height: 110px !important; }
  #vetImg { height: 120px !important; }
  .header-title { font-size: 26px !important; }
  .game-title { font-size: clamp(28px, 8vw, 38px) !important; }
  .foal-wrap { width: 45% !important; }
}
</style>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Horse Care">

<body>
<div class="screen">
  <div class="bg"></div>

  <!-- Header -->
  <div class="header">
    <button class="btn-back" onclick="GameData.save(gd); window.location.href='hub.html'">← Hub</button>
    <span class="header-title">Shop</span>
    <div class="coins-badge">
      <span class="coins-icon">🪙</span>
      <span class="coins-amount" id="coinsDisplay">0</span>
    </div>
  </div>

  <!-- Münz-Info -->
  <div class="coin-info">
    <span style="font-size:18px;">🪙</span>
    <span class="coin-info-text">
      In der Fohlenphase verdienst du <b>~10 Münzen/Stunde</b> automatisch.
      Später kommen Turniere & Ausritte dazu!
    </span>
  </div>

  <!-- Kategorie-Tabs -->
  <div class="tabs">
    <div class="tab active" onclick="setCategory('alle')">Alle</div>
    <div class="tab" onclick="setCategory('futter')">🌾 Futter</div>
    <div class="tab" onclick="setCategory('trinken')">💧 Trinken</div>
    <div class="tab" onclick="setCategory('lecker')">🍎 Leckereien</div>
    <div class="tab" onclick="setCategory('pflege')">🪮 Pflege</div>
  </div>

  <!-- Artikel -->
  <div class="shop-scroll">
    <div class="items-grid" id="itemsGrid"></div>
  </div>
</div>

<script src="gamedata.js"></script>
<script>
const ICONS = {
  icon_heuballen:  'icon_heuballen.png',
  icon_futtertrog: 'icon_futtertrog.png',
  icon_mash:       'icon_mash.png',
  icon_eimer:      'icon_eimer.png',
  icon_apfel:      'icon_apfel.png',
  icon_buerste:    'icon_buerste.png',
  icon_hufkratzer: 'icon_hufkratzer.png',
  icon_putzen:     'icon_putzen.png',
  icon_traenke:    'icon_traenke.png',
};
const ITEMS = [
    // FUTTER
    {"id":"heu",          "cat":"futter",  "name":"Heu (7 Portionen)", "desc":"Eine Woche Grundfutter. Stillt den Hunger zuverlässig.",         "price":35,  "effects":{"hunger":0},     "inv":"heu",          "qty":7,   "icon": ICONS.icon_heuballen},
    {"id":"kraftfutter",  "cat":"futter",  "name":"Kraftfutter",        "desc":"Energiereiches Futter für mehr Ausdauer.",                        "price":18,  "effects":{"hunger":35,"energy":15}, "inv":"kraftfutter","qty":1,   "icon": ICONS.icon_futtertrog},
    {"id":"mash",         "cat":"futter",  "name":"Mash",               "desc":"Wärmendes Schrot – Energie pur.",                                 "price":25,  "effects":{"hunger":25,"energy":30}, "inv":"mash",       "qty":1,   "icon": ICONS.icon_mash},
    // TRINKEN
    {"id":"eimer",        "cat":"trinken", "name":"Eimer Wasser",       "desc":"Großer Eimer – stillt den Durst lange. Wasser gibt's auch gratis im Stall.", "price":10, "effects":{"thirst":50}, "inv":"eimer","qty":1, "icon": ICONS.icon_eimer},
    {"id":"kraeutertee",  "cat":"trinken", "name":"Kräutertee",         "desc":"Beruhigend & wohltuend. Steigert Zufriedenheit.",                 "price":22,  "effects":{"thirst":30,"happiness":15}, "inv":"kraeutertee","qty":1, "icon": ICONS.icon_mash},
    // LECKEREIEN
    {"id":"apfel",        "cat":"lecker",  "name":"Apfel",              "desc":"Ein frischer Apfel – das Lieblingsleckerli!",                    "price":12,  "effects":{"happiness":20,"hunger":5}, "inv":"apfel",     "qty":1,   "icon": ICONS.icon_apfel},
    {"id":"karotte",      "cat":"lecker",  "name":"Karotte",            "desc":"Knackig und süß – macht gute Laune.",                            "price":10,  "effects":{"happiness":15,"hunger":8}, "inv":"karotte",   "qty":1,   "icon": ICONS.icon_apfel},
    {"id":"zuckerwuerfel","cat":"lecker",  "name":"Zuckerwürfel",       "desc":"Der absolute Favorit – maximale Freude!",                        "price":30,  "effects":{"happiness":40},            "inv":"zuckerwuerfel","qty":1,"icon": ICONS.icon_apfel},
    // PFLEGE
    {"id":"buerste",      "cat":"pflege",  "name":"Bürste",             "desc":"Pflegt das Fell und macht es glänzend.",                         "price":15,  "effects":{"hygiene":25,"happiness":10},"inv":"buerste",  "qty":1,   "icon": ICONS.icon_buerste},
    {"id":"hufkratzer",   "cat":"pflege",  "name":"Hufkratzer",         "desc":"Sauber gepflegte Hufe für ein glückliches Pferd.",               "price":12,  "effects":{"hygiene":15,"happiness":8}, "inv":"hufkratzer","qty":1,  "icon": ICONS.icon_hufkratzer},
    {"id":"vollpflege",   "cat":"pflege",  "name":"Vollpflege-Set",     "desc":"Bürste, Hufkratzer & Tuch – das komplette Paket.",               "price":45,  "effects":{"hygiene":50,"happiness":20},"inv":"vollpflege","qty":1,  "icon": ICONS.icon_putzen},
];

let gd = GameData.load();
let currentCat = 'alle';

// ── Münzen-Aufladen (10/h = 1 alle 6 Minuten) ──────────
function accrueCoinsSinceLastVisit() {
  const RATE_PER_MS = 10 / (60 * 60 * 1000); // 10 pro Stunde
  if (!gd.lastCoinAccrual) {
    gd.lastCoinAccrual = new Date().toISOString();
    return;
  }
  const elapsed = Date.now() - new Date(gd.lastCoinAccrual).getTime();
  const earned  = Math.floor(elapsed * RATE_PER_MS);
  if (earned > 0) {
    gd.coins = (gd.coins || 0) + earned;
    gd.lastCoinAccrual = new Date().toISOString();
  }
}

// Auch im Hintergrund weiterlaufen lassen wenn Seite offen ist
setInterval(() => {
  accrueCoinsSinceLastVisit();
  document.getElementById('coinsDisplay').textContent = Math.floor(gd.coins || 0);
}, 30000); // alle 30 Sek UI updaten

// ── Kategorie-Filter ────────────────────────────────────
function setCategory(cat) {
  currentCat = cat;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  renderItems();
}

// ── Artikel rendern ─────────────────────────────────────
const EFFECT_LABELS = {
  hunger:    'Hunger',
  thirst:    'Durst',
  energy:    'Energie',
  hygiene:   'Sauberkeit',
  happiness: 'Zufriedenheit',
};

function getInv(key) {
  if (!gd.inventory) return 0;
  const v = gd.inventory[key];
  if (v === undefined || v === null) return 0;
  if (typeof v === 'object') return v.qty || 0; // Pflegeartikel
  return v;
}
function getItemDurability(key) {
  if (!gd.inventory) return 0;
  const v = gd.inventory[key];
  if (typeof v === 'object') return v.durability || 0;
  return 0;
}

function renderItems() {
  const coins   = Math.floor(gd.coins || 0);
  const filtered = currentCat === 'alle'
    ? ITEMS
    : ITEMS.filter(i => i.cat === currentCat);

  const grid = document.getElementById('itemsGrid');
  grid.innerHTML = filtered.map(item => {
    const canAfford = coins >= item.price;
    const effects   = Object.entries(item.effects)
      .map(([k,v]) => `<span class="effect-chip ${k}">+${v} ${EFFECT_LABELS[k] || k}</span>`)
      .join('');
    const ownedQty = getInv(item.inv);
    const durability = item.durability ? getItemDurability(item.inv) : 0;
    let ownedBadge = '';
    if (ownedQty > 0 && item.durability) {
      ownedBadge = `<div class="owned-badge">🔧 ${durability}/${item.durability} Nutzungen</div>`;
    } else if (ownedQty > 0) {
      ownedBadge = `<div class="owned-badge">Vorhanden: ${ownedQty}</div>`;
    }
    return `
      <div class="item-card ${canAfford ? '' : 'cant-afford'}"
           onclick="buyItem('${item.id}')">
        <img class="item-img" src="${item.icon}" alt="${item.name}">
        <div class="item-name">${item.name}</div>
        <div class="item-desc">${item.desc}</div>
        <div class="item-effects">${effects}</div>
        ${ownedBadge}
        <div class="item-price">🪙 ${item.price}</div>
      </div>`;
  }).join('');
}

// ── Kauf-Logik ───────────────────────────────────────────
function buyItem(id) {
  const item   = ITEMS.find(i => i.id === id);
  const coins  = Math.floor(gd.coins || 0);
  if (!item || coins < item.price) {
    showToast('Zu wenig Münzen!', true);
    return;
  }

  // Münzen abziehen
  gd.coins = coins - item.price;
  gd.lastCoinAccrual = gd.lastCoinAccrual || new Date().toISOString();

  // Inventar befüllen
  if (!gd.inventory) gd.inventory = {};
  if (item.inv === 'heu') {
    gd.inventory.heu = (gd.inventory.heu || 0) + 7;
  } else if (['kraftfutter','mash','eimer','kraeutertee'].includes(item.inv)) {
    gd.inventory[item.inv] = (gd.inventory[item.inv] || 0) + 1;
  } else if (item.durability) {
    // Pflegeartikel: Haltbarkeit setzen
    const cur = gd.inventory[item.inv] || { qty: 0, durability: 0 };
    if (cur.qty === 0) {
      // Erster Kauf: Haltbarkeit des neuen Artikels setzen
      cur.durability = item.durability;
    }
    cur.qty += 1;
    gd.inventory[item.inv] = cur;
  } else {
    // Leckereien: sofort anwenden
    Object.entries(item.effects).forEach(([stat, val]) => {
      if (val > 0) gd = GameData.setStat(gd, stat, gd.stats[stat] + val);
    });
    gd.inventory[item.inv] = (gd.inventory[item.inv] || 0) + 1;
  }

  // Flash-Animation auf der Karte
  const cards = document.querySelectorAll('.item-card');
  cards.forEach(card => {
    if (card.querySelector('.item-name')?.textContent === item.name) {
      const flash = document.createElement('div');
      flash.className = 'buy-flash';
      card.appendChild(flash);
      setTimeout(() => flash.remove(), 400);
    }
  });

  document.getElementById('coinsDisplay').textContent = Math.floor(gd.coins);
  const bounce = document.getElementById('coinsDisplay');
  bounce.style.transform = 'scale(1.3)';
  setTimeout(() => { bounce.style.transform = ''; }, 200);

  showToast(`${item.name} gekauft! 🪙-${item.price}`);
  renderItems();
}

// ── Toast ────────────────────────────────────────────────
function showToast(msg, isErr=false) {
  const t = document.createElement('div');
  t.className = 'toast' + (isErr ? ' err' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 980);
}

// ── Auto-Speichern ────────────────────────────────────────
GameData.registerAutosave(() => gd);
