<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Horse Care – Tierarzt</title>
<style>
/* iOS Safari: verhindert Doppel-Scroll und ermöglicht inneres Scrolling */
html { height: 100%; }
body { height: 100%; overflow: hidden; position: fixed; width: 100%; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  width:100vw; height:100svh; overflow:hidden;
  background:#f0f7f4;
  font-family:'Crimson Pro', serif;
}

.screen {
  position:relative; width:100%; height:100svh;
  max-width:430px; margin:0 auto;
  display:flex; flex-direction:column;
  overflow:hidden;
}

/* Hintergrund-Gradient */
.bg {
  position:absolute; inset:0; z-index:0;
  background:
    radial-gradient(ellipse 100% 60% at 50% 0%, #c8e6da 0%, transparent 70%),
    linear-gradient(180deg, #f0f7f4 0%, #e5f2ec 100%);
}

/* Deko-Kreise */
.deco {
  position:absolute; border-radius:50%;
  background:rgba(90,171,109,0.08);
  pointer-events:none; z-index:0;
}
.d1 { width:300px; height:300px; top:-80px; right:-80px; }
.d2 { width:200px; height:200px; bottom:30%; left:-60px; }

/* ── HEADER ── */
.header {
  position:relative; z-index:10;
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 16px 10px;
  background:linear-gradient(to bottom, rgba(255,255,255,0.9) 0%, transparent 100%);
}
.btn-back {
  background:rgba(255,255,255,0.9);
  border:1px solid rgba(150,200,170,0.5);
  border-radius:50px; padding:7px 16px;
  color:#2d5a4a; font-family:'Crimson Pro'; font-size:14px; font-weight:600;
  cursor:pointer; backdrop-filter:blur(6px);
  -webkit-tap-highlight-color:transparent;
  transition:background .15s;
}
.btn-back:active { background:rgba(220,240,235,0.95); }
.header-title {
  font-family:'Great Vibes'; font-size:34px; color:#2d5a4a;
  text-shadow:0 2px 10px rgba(0,0,0,0.5);
}
.header-right { width:80px; } /* Platzhalter für Balance */

/* ── TIERARZT-HELD ── */
.vet-hero {
  position:relative; z-index:10;
  margin:0 16px 0;
  background:rgba(220,240,230,0.6);
  border:1px solid rgba(150,200,170,0.4);
  border-radius:20px;
  overflow:hidden;
  display:flex; align-items:flex-end;
  height:clamp(130px, 25svh, 180px);
  flex-shrink:0;
}
#vetImg {
  position:absolute; bottom:0; left:50%; transform:translateX(-50%);
  height:clamp(140px, 27svh, 190px); width:auto;
  object-fit:contain;
  filter:drop-shadow(0 6px 18px rgba(0,0,0,0.4));
  z-index:1;
}
.vet-hero-info {
  position:relative; z-index:2;
  padding:12px 14px;
  flex:1;
  background:linear-gradient(to top, rgba(200,235,220,0.8) 0%, transparent 100%);
  align-self:stretch; display:flex; flex-direction:column; justify-content:flex-end;
}
.vet-hero-name {
  font-family:'Great Vibes'; font-size:26px; color:#2d5a4a;
  line-height:1; margin-bottom:2px;
  text-shadow:0 2px 6px rgba(0,0,0,0.5);
}
.vet-hero-sub {
  font-size:11px; color:rgba(45,90,74,0.6); font-style:italic;
}
.vet-status {
  position:absolute; top:10px; right:10px; z-index:3;
}

/* ── TIERARZT-KARTE (alt, nicht mehr genutzt) ── */
.vet-card {
  position:relative; z-index:10;
  margin:0 16px 0;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:20px; padding:16px;
  display:flex; align-items:center; gap:14px;
}
.vet-avatar {
  width:56px; height:56px; border-radius:50%;
  background:linear-gradient(135deg,#2d6a4f,#52b788);
  display:flex; align-items:center; justify-content:center;
  font-size:28px; flex-shrink:0;
  box-shadow:0 4px 14px rgba(82,183,136,0.3);
}
.vet-info { flex:1; }
.vet-name {
  font-family:'Great Vibes'; font-size:22px; color:#fff;
  line-height:1; margin-bottom:2px;
}
.vet-sub {
  font-size:12px; color:rgba(255,255,255,0.45); font-style:italic;
}
.vet-status {
  font-size:11px; font-weight:600; padding:3px 10px;
  border-radius:50px; text-align:center; flex-shrink:0;
}
.vet-status.ok      { background:rgba(82,183,136,0.2); color:#52b788; border:1px solid #52b788; }
.vet-status.warn    { background:rgba(255,180,0,0.2);  color:#ffb400; border:1px solid #ffb400; }
.vet-status.danger  { background:rgba(220,53,69,0.2);  color:#dc3545; border:1px solid #dc3545; }
.vet-status.dead    { background:rgba(100,100,100,0.2);color:#aaa;    border:1px solid #666; }

/* ── SCROLL-BEREICH ── */
.scroll-area {
  position:relative; z-index:10;
  flex:1;
  overflow-y: scroll;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding:12px 16px 32px;
}
.scroll-area::-webkit-scrollbar { display:none; }

/* Warnung-Banner */
.warning-banner {
  display:none;
  background:rgba(255,235,235,0.95);
  border:1px solid rgba(220,53,69,0.35);
  border-radius:14px; padding:12px 14px;
  margin-bottom:12px;
  color:#c0392b; font-size:13px; line-height:1.5;
  text-align:center;
}
.warning-banner.visible { display:block; }

/* Game-Over-Banner */
.gameover-banner {
  display:none;
  background:rgba(0,0,0,0.6);
  border:1px solid rgba(220,53,69,0.6);
  border-radius:14px; padding:18px;
  margin-bottom:12px; text-align:center;
}
.gameover-banner.visible { display:block; }
.gameover-emoji { font-size:40px; margin-bottom:8px; }
.gameover-title {
  font-family:'Great Vibes'; font-size:32px; color:#dc3545;
  margin-bottom:6px;
}
.gameover-text {
  font-size:13px; color:rgba(255,255,255,0.6);
  line-height:1.5; margin-bottom:14px;
}
.btn-restart {
  background:linear-gradient(135deg,#c0392b,#e74c3c);
  border:none; border-radius:50px; padding:12px 30px;
  font-family:'Great Vibes'; font-size:24px; color:#fff;
  cursor:pointer; width:100%;
  box-shadow:0 4px 16px rgba(220,53,69,0.4);
  -webkit-tap-highlight-color:transparent;
}
.btn-restart:active { transform:scale(.97); }

/* Abschnitt-Titel */
.section-title {
  font-size:11px; font-weight:600; letter-spacing:1.8px;
  text-transform:uppercase; color:rgba(45,90,74,0.5);
  margin:14px 0 8px;
}

/* Status-Übersicht */
.stat-overview {
  display:grid; grid-template-columns:1fr 1fr; gap:8px;
  margin-bottom:4px;
}
.stat-card {
  background:rgba(255,255,255,0.9);
  border:1px solid rgba(180,220,200,0.5);
  box-shadow:0 2px 8px rgba(100,160,140,0.1);
  border-radius:12px; padding:8px 10px;
  display:flex; align-items:center; gap:8px;
}
.stat-card.critical {
  border-color:rgba(220,53,69,0.4);
  background:rgba(220,53,69,0.08);
}
.stat-card img {
  width:26px; height:26px; object-fit:contain; flex-shrink:0;
}
.stat-card-info { flex:1; min-width:0; }
.stat-card-name {
  font-size:10px; font-weight:600; color:rgba(45,90,74,0.55);
  text-transform:uppercase; letter-spacing:.5px;
}
.stat-card-val {
  font-size:16px; font-weight:600; color:#2d5a4a;
}
.stat-card.critical .stat-card-val { color:#ff6b7a; }

/* Behandlungs-Optionen */
.treatment-list {
  display:flex; flex-direction:column; gap:8px;
  margin-bottom:12px;
}
.treatment-btn {
  background:rgba(255,255,255,0.9);
  border:1px solid rgba(180,220,200,0.5);
  box-shadow:0 2px 8px rgba(100,160,140,0.08);
  border-radius:14px; padding:12px 14px;
  display:flex; align-items:center; gap:12px;
  cursor:pointer; text-align:left; width:100%;
  transition:background .15s, transform .1s;
  -webkit-tap-highlight-color:transparent;
}
.treatment-btn:active { background:rgba(220,240,235,0.95); transform:scale(.98); }
.treatment-btn:disabled {
  opacity:0.35; pointer-events:none;
}
.treatment-btn.highlight {
  border-color:rgba(45,150,100,0.5);
  background:rgba(200,240,220,0.6);
}
.treat-icon {
  width:42px; height:42px; object-fit:contain; flex-shrink:0;
}
.treat-info { flex:1; }
.treat-name {
  font-size:14px; font-weight:600; color:#2d5a4a; display:block; margin-bottom:2px;
}
.treat-desc {
  font-size:11px; color:rgba(45,90,74,0.55); line-height:1.4;
}
.treat-effect {
  font-size:11px; font-weight:600; color:#52b788; white-space:nowrap; flex-shrink:0;
}

/* Krankheiten-Platzhalter */
.diseases-placeholder {
  background:rgba(240,247,244,0.8);
  border:1px dashed rgba(150,200,170,0.5);
  border-radius:14px; padding:16px;
  text-align:center;
  color:rgba(45,90,74,0.4);
  font-size:13px; font-style:italic; line-height:1.5;
}

/* Letzter Besuch */
.last-visit {
  text-align:center;
  font-size:12px; color:rgba(45,90,74,0.4);
  font-style:italic; padding-bottom:8px;
}

/* Toast */
.toast {
  position:fixed; top:18%; left:50%; transform:translateX(-50%);
  background:rgba(82,183,136,0.92); color:#fff;
  font-family:'Crimson Pro'; font-size:16px; font-weight:600;
  padding:8px 22px; border-radius:50px;
  pointer-events:none; z-index:999; white-space:nowrap;
  animation:toastAnim .9s ease forwards;
}
@keyframes toastAnim {
  0%   { opacity:0; transform:translateX(-50%) translateY(10px); }
  20%  { opacity:1; transform:translateX(-50%) translateY(0); }
  80%  { opacity:1; }
  100% { opacity:0; transform:translateX(-50%) translateY(-10px); }
}

/* ══════════════════════════════════════════
   RESPONSIVE – iPhone SE (375×667) Support
   ══════════════════════════════════════════ */

/* Nutze dvh (dynamic viewport height) wo verfügbar,
   fallback auf 100vh für ältere Safari */
:root {
  --vh: 1vh;
  --screen-h: 100vh;
}

/* Safe-area für Home-Indicator (neuere iPhones) */
.screen, body {
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

/* SE-spezifische Verkleinerungen */

  /* Kleinere Schrift & Abstände generell */

  /* Header kompakter */

  /* Panels kompakter */
  .action-panel, .bottom-zone, .info-panel {

  }

  /* Abstände reduzieren */

  .menu-grid { gap: 5px !important; }
  .status-section { margin-bottom: 5px !important; }
  .status-row { margin-bottom: 3px !important; }
  .xp-row { margin-bottom: 5px !important; }
  .treatment-list { gap: 5px !important; }

  /* Kleinere Icons in Grids */
  .menu-btn img { width: 34px !important; height: 34px !important; }

  .menu-btn span { font-size: 9px !important; }

  /* Kleinere Task-Rows */
  .task-row { padding: 7px 10px !important; }
  .task-icon { width: 32px !important; height: 32px !important; }
  .task-name { font-size: 13px !important; }
  .task-desc { font-size: 10px !important; }

  /* Status-Icons kleiner */
  .status-icon-sm { width: 20px !important; height: 20px !important; }
  .status-label { font-size: 10px !important; width: 60px !important; }
  .bar-bg { height: 6px !important; }
  .bar-pct { font-size: 10px !important; }

  /* Zeitanzeige kompakter */
  .time-bar { padding: 4px 10px !important; margin-bottom: 5px !important; }
  .time-display { font-size: 15px !important; }

  /* Münz-Badge */
  .coins-badge { padding: 4px 10px !important; }
  .coins-amount { font-size: 14px !important; }

  /* Wetter-Info-Bar */
  .weather-info-bar { padding: 5px 10px !important; margin-bottom: 5px !important; font-size: 10px !important; }
  .weather-info-icon { font-size: 14px !important; }

  /* Feed-Buttons im Stall */
  .menu-btn-feed { padding: 6px 4px 4px !important; }
  .menu-btn-feed img { width: 30px !important; height: 30px !important; }

  /* Shop-Grid enger */
  .items-grid { gap: 7px !important; }
  .item-img { width: 44px !important; height: 44px !important; }
  .item-name { font-size: 12px !important; }
  .item-desc { font-size: 9px !important; }

  /* Behandlungs-Buttons im Tierarzt */
  .treatment-btn { padding: 9px 12px !important; }
  .treat-icon { width: 34px !important; height: 34px !important; }

  .treat-desc { font-size: 10px !important; }

  /* Stat-Karten */
  .stat-card { padding: 6px 8px !important; }
  .stat-card img { width: 20px !important; height: 20px !important; }
  .stat-card-val { font-size: 14px !important; }

  /* Tierarzt-Hero kleiner */

  #vetImg { height: 150px !important; }
}

/* Noch kleinere Geräte (z.B. iPhone SE 1. Gen, 568px Höhe) */
@media screen and (max-height: 580px) {
  .vet-hero { height: 110px !important; }
  #vetImg { height: 120px !important; }
  .header-title { font-size: 26px !important; }

<body>
<div class="screen">
  <div class="bg"></div>
  <div class="deco d1"></div>
  <div class="deco d2"></div>

  <!-- Header -->
  <div class="header">
    <button class="btn-back" onclick="goBack()">← Hub</button>
    <span class="header-title">Tierarzt</span>
    <div class="header-right"></div>
  </div>

  <!-- Tierarzt-Karte -->
  <!-- Tierarzt-Bild -->
  <div class="vet-hero">
    <img src="tierarzt.png" alt="Steffi" id="vetImg">
    <div class="vet-hero-info">
      <div class="vet-hero-name">Steffi</div>
      <div class="vet-hero-sub">Pferde- &amp; Fohlenspezialistin</div>
    </div>
    <div class="vet-status ok" id="vetStatus">Bereit</div>
  </div>

  <!-- Scroll-Bereich -->
  <div class="scroll-area">

    <!-- Game-Over -->
    <div class="gameover-banner" id="gameoverBanner">
      <div class="gameover-emoji">💔</div>
      <div class="gameover-title">Zu spät…</div>
      <div class="gameover-text" id="gameoverText">
        Dein Fohlen war zu lange ohne Pflege.<br>
        Auch Steffi konnte leider nicht mehr helfen.
      </div>
      <button class="btn-restart" onclick="restartGame()">Neues Fohlen</button>
    </div>

    <!-- Warn-Banner -->
    <div class="warning-banner" id="warnBanner"></div>

    <!-- Status-Übersicht -->
    <div class="section-title">Zustand des Pferdes</div>
    <div class="stat-overview" id="statOverview"></div>

    <!-- Behandlungen -->
    <div class="section-title">Behandlungen</div>
    <div class="treatment-list" id="treatmentList"></div>

    <!-- Krankheiten -->
    <div class="section-title">Krankheiten</div>
    <div class="diseases-placeholder">
      🔬 Krankheiten werden in einer späteren Version eingeführt.<br>
      Steffi hält die Augen offen!
    </div>

    <!-- Letzter Besuch -->
    <div class="section-title" style="margin-top:14px;"></div>
    <div class="last-visit" id="lastVisit"></div>

  </div>
</div>

<script src="gamedata.js"></script>
<script>
let gd = GameData.load();

// ── Kritikalitätsschwelle ─────────────────────
// Nach wie vielen Tagen mit mind. 1 Wert auf 0 ist Game Over
const GAMEOVER_DAYS = 3;

const STAT_META = [
  { key:'hunger',    label:'Hunger',     icon:'icon_heuballen.png' },
  { key:'thirst',    label:'Durst',      icon:'icon_traenke.png' },
  { key:'energy',    label:'Energie',    icon:'icon_mash.png' },
  { key:'hygiene',   label:'Sauberkeit', icon:'icon_sauberkeit.png' },
  { key:'happiness', label:'Zufriedenheit',      icon:'icon_glueck.png' },
];

// ── Kritischen Zustand tracken ────────────────
function updateCriticalTracking() {
  const today = new Date().toISOString().slice(0,10);
  const hasCritical = Object.values(gd.stats).some(v => v <= 0);

  if (hasCritical) {
    if (!gd.criticalSince) {
      gd.criticalSince = today;
    }
  } else {
    gd.criticalSince = null;
  }
}

function getDaysSinceCritical() {
  if (!gd.criticalSince) return 0;
  const since = new Date(gd.criticalSince);
  const now   = new Date();
  return Math.floor((now - since) / (1000 * 60 * 60 * 24));
}

function isGameOver() {
  return getDaysSinceCritical() >= GAMEOVER_DAYS;
}

// ── UI aufbauen ───────────────────────────────
function renderUI() {
  updateCriticalTracking();

  const go       = isGameOver();
  const daysCrit = getDaysSinceCritical();
  const hasCrit  = daysCrit > 0;

  // Game-Over-Banner
  document.getElementById('gameoverBanner').classList.toggle('visible', go);

  // Vet-Status-Badge
  const vetEl = document.getElementById('vetStatus');
  if (go) {
    vetEl.textContent = 'Zu spät';
    vetEl.className   = 'vet-status dead';
  } else if (daysCrit >= 2) {
    vetEl.textContent = 'Kritisch!';
    vetEl.className   = 'vet-status danger';
  } else if (hasCrit) {
    vetEl.textContent = 'Dringend!';
    vetEl.className   = 'vet-status warn';
  } else {
    vetEl.textContent = 'Bereit';
    vetEl.className   = 'vet-status ok';
  }

  // Warn-Banner
  const warnEl = document.getElementById('warnBanner');
  if (!go && daysCrit === 1) {
    warnEl.textContent = '⚠️ Ein oder mehrere Werte sind auf 0! Dein Pferd braucht dringend Hilfe. Noch ' + (GAMEOVER_DAYS - daysCrit) + ' Tag(e) bis Steffi aufgibt.';
    warnEl.classList.add('visible');
  } else if (!go && daysCrit >= 2) {
    warnEl.textContent = '🚨 Kritischer Zustand seit ' + daysCrit + ' Tagen! Nur noch ' + (GAMEOVER_DAYS - daysCrit) + ' Tag(e) – handle jetzt!';
    warnEl.classList.add('visible');
  } else {
    warnEl.classList.remove('visible');
  }

  // Stat-Karten
  const overview = document.getElementById('statOverview');
  overview.innerHTML = STAT_META.map(m => {
    const val = Math.round(gd.stats[m.key]);
    const crit = val <= 0;
    return `<div class="stat-card ${crit ? 'critical' : ''}">
      <img src="${m.icon}" alt="${m.label}">
      <div class="stat-card-info">
        <div class="stat-card-name">${m.label}</div>
        <div class="stat-card-val">${crit ? '⚠️ 0%' : val + '%'}</div>
      </div>
    </div>`;
  }).join('');

  // Behandlungen
  renderTreatments(go);

  // Letzter Besuch
  const lv = document.getElementById('lastVisit');
  if (gd.lastVetVisit) {
    const d = new Date(gd.lastVetVisit);
    lv.textContent = 'Letzter Besuch: ' + d.toLocaleDateString('de-DE', {day:'2-digit',month:'long',year:'numeric'});
  } else {
    lv.textContent = 'Noch kein Besuch eingetragen.';
  }
}

function renderTreatments(disabled) {
  const anyLow     = Object.values(gd.stats).some(v => v < 30);
  const anyCritical = Object.values(gd.stats).some(v => v <= 0);

  const treatments = [
    {
      id:     'checkup',
      name:   'Routine-Untersuchung',
      desc:   'Steffi prüft den Gesamtzustand und gibt Empfehlungen.',
      effect: '+5 Zufriedenheit',
      icon:   'icon_glueck.png',
      highlight: false,
      alwaysOn: true,
      action: () => {
        gd = GameData.setStat(gd, 'happiness', gd.stats.happiness + 5);
        gd.lastVetVisit = new Date().toISOString();
        showToast('✓ Untersuchung abgeschlossen!');
        renderUI();
      }
    },
    {
      id:     'aufpeppeln',
      name:   'Aufpeppeln',
      desc:   'Alle kritischen Werte werden auf 30% angehoben. Nur nötig wenn Werte auf 0 gefallen sind.',
      effect: 'Alle 0-Werte → 30%',
      icon:   'icon_apfel.png',
      highlight: anyCritical,
      alwaysOn: false,
      disabled: !anyCritical,
      action: () => {
        let changed = false;
        ['hunger','thirst','energy','hygiene','happiness'].forEach(k => {
          if (gd.stats[k] <= 0) {
            gd = GameData.setStat(gd, k, 30);
            changed = true;
          }
        });
        gd.criticalSince = null; // kritischer Zustand behoben
        gd.lastVetVisit  = new Date().toISOString();
        gd = GameData.addXP(gd, -10); // kleine XP-Strafe
        showToast('💉 Pferd aufgepeppelt!');
        renderUI();
      }
    },
    {
      id:     'vitamine',
      name:   'Vitaminkur',
      desc:   'Stärkt das Immunsystem. Alle Werte steigen leicht an.',
      effect: 'Alle Werte +10%',
      icon:   'icon_mash.png',
      highlight: false,
      alwaysOn: false,
      disabled: !anyLow,
      action: () => {
        ['hunger','thirst','energy','hygiene','happiness'].forEach(k => {
          gd = GameData.setStat(gd, k, gd.stats[k] + 10);
        });
        gd.lastVetVisit = new Date().toISOString();
        showToast('🌿 Vitaminkur gegeben!');
        renderUI();
      }
    },
    {
      id:     'huf',
      name:   'Hufkontrolle',
      desc:   'Hufe werden kontrolliert und gepflegt.',
      effect: '+8 Zufriedenheit',
      icon:   'icon_hufkratzer.png',
      highlight: false,
      alwaysOn: true,
      action: () => {
        gd = GameData.setStat(gd, 'happiness', gd.stats.happiness + 8);
        gd.lastVetVisit = new Date().toISOString();
        showToast('🐴 Hufe gepflegt!');
        renderUI();
      }
    },
  ];

  const list = document.getElementById('treatmentList');
  list.innerHTML = '';

  treatments.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'treatment-btn' + (t.highlight ? ' highlight' : '');
    if (disabled || t.disabled) btn.disabled = true;
    btn.innerHTML = `
      <img class="treat-icon" src="${t.icon}" alt="${t.name}">
      <div class="treat-info">
        <span class="treat-name">${t.name}</span>
        <span class="treat-desc">${t.desc}</span>
      </div>
      <span class="treat-effect">${t.effect}</span>
    `;
    btn.onclick = t.action;
    list.appendChild(btn);
  });
}

// ── Game Over ─────────────────────────────────
function restartGame() {
  GameData.reset();
  window.location.href = 'titlescreen.html';
}

// ── Toast ─────────────────────────────────────
function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 950);
}

// ── Navigation ────────────────────────────────
function goBack() {
  GameData.save(gd);
  window.location.href = 'hub.html';
}

// ── Auto-Speichern ────────────────────────────
GameData.registerAutosave(() => gd);

// ── Init ──────────────────────────────────────
renderUI();
</script>
</body>
</html>
