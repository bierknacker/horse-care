<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Horse Care – Interaktionen</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Crimson+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:100vw; height:100vh; background:#0a1520; font-family:'Crimson Pro',serif;
  display:flex; flex-direction:column; align-items:center; justify-content:center; }
.screen { max-width:430px; width:100%; height:100%; display:flex; flex-direction:column; }
.header { display:flex; align-items:center; justify-content:space-between;
  padding:16px 16px 10px;
  background:linear-gradient(to bottom,rgba(0,0,0,0.4) 0%,transparent 100%); }
.btn-back { background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15);
  border-radius:50px; padding:7px 16px; color:#fff; font-family:'Crimson Pro';
  font-size:14px; font-weight:600; cursor:pointer; }
.header-title { font-family:'Great Vibes'; font-size:34px; color:#fff; }
.placeholder { flex:1; display:flex; flex-direction:column; align-items:center;
  justify-content:center; padding:30px; text-align:center; gap:16px; }
.placeholder-icon { font-size:64px; }
.placeholder-title { font-family:'Great Vibes'; font-size:36px; color:#fff; }
.placeholder-text { font-size:14px; color:rgba(255,255,255,0.4); line-height:1.6; font-style:italic; }
.coming-badge { background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15);
  border-radius:50px; padding:8px 20px; font-size:12px; font-weight:600;
  letter-spacing:2px; color:rgba(255,255,255,0.4); text-transform:uppercase; }
</style>
</head>
<body>
<div class="screen">
  <div class="header">
    <button class="btn-back" onclick="window.location.href='hub.html'">← Hub</button>
    <span class="header-title">Interaktionen</span>
    <div style="width:80px;"></div>
  </div>
  <div class="placeholder">
    <div class="placeholder-icon">🐴✨</div>
    <div class="placeholder-title">Bald verfügbar</div>
    <div class="placeholder-text">
      Hier kannst du bald mit deinem Pferd spielen, es spazieren führen,
      trainieren und eine tiefe Bindung aufbauen.<br><br>
      Turniere, Ausritte und mehr kommen in zukünftigen Updates!
    </div>
    <div class="coming-badge">Coming Soon</div>
  </div>
</div>
</body>
</html>
